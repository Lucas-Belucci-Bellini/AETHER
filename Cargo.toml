[workspace]
resolver = "3"
members = ["crates/*", "examples/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
liga-core = { path = "crates/liga-core", version = "0.1.0" }
liga-modules = { path = "crates/liga-modules", version = "0.1.0" }
liga-web = { path = "crates/liga-web", version = "0.1.0" }
liga-tasks = { path = "crates/liga-tasks", version = "0.1.0" }
liga-ai = { path = "crates/liga-ai", version = "0.1.0" }
liga = { path = "crates/liga", version = "0.1.0", default-features = false }

axum = { version = "0.8.9", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false }
toml = "1.1.8"
tower = { version = "0.5.3", default-features = false }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false }
uuid = { version = "1.29.0", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
